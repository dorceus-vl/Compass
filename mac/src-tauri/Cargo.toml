[package]
name = "compass"
version = "0.1.0"
description = "Compass for Mac"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "compass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
